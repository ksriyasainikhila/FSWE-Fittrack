services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fittrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack -d fittrack"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fittrack_pgdata:
